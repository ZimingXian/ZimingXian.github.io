    - id: engineer-main-control-board
      title: 工程机器人主控板
      status: 已落地
      summary: 基于 STM32G473 的工程机器人主控板，集成气泵、气阀、气压检测和大功率继电器等功能。
      images:
        - assets/projects/engineer-main-control-board/c_mcbeng_2.jpg
        - assets/projects/engineer-main-control-board/c_mcbeng_0.jpg
        - assets/projects/engineer-main-control-board/c_mcbeng_1.jpg
      metrics:
        - 双板结构
        - 多路气压与气泵驱动
        - 集成大功率继电器控制
      highlights:
        - 使用 MCU 内部运放实现四路气压传感器电压放大和检测
        - 将工程机器人常用执行与检测接口集中到主控板
      notes:
        - title: 气动系统接口集成
          content: 工程机器人外设类型多、线束复杂。主控板需要同时处理低压传感、阀泵驱动和大功率电源通断，因此接口分区和保护设计比单一控制板更重要。

