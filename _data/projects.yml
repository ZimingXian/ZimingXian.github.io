        - assets/projects/wireless-charging/c_wpt_3.jpg
        - assets/projects/wireless-charging/c_wpt_4.jpg
      metrics:
        - 最大功率 150W
        - title: 整体充电效率约 86%
          content: 测试条件：供电电压 24V，接收端电压限制 29.5V（规则电压限制）
        - LCC-S 拓扑，全桥激励源
        - ASK 反向通信实现功率闭环
      highlights:
        - 鲁棒性强，线圈可承受约 15mm 水平/垂直偏移
        - 可稳定进行异物检测并触发保护
        - 通过接收端反馈实现功率闭环和异常保护
        - 纯被动机械对位结构，提升机器人对位可靠性
