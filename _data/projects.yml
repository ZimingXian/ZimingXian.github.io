    - id: fpga-audio
      title: 基于 FPGA 的音频处理系统
      status: 课程项目
      summary: 基于 BASYS3 开发板实现多种音频滤波功能，并通过 VGA 输出交互界面进行控制和状态显示。
      images:
        - assets/projects/fpga-audio/c_fpga.png
        - assets/projects/fpga-audio/c_fpga_2.jpg
      metrics:
        - 5 段均衡器
        - FIR / IIR 滤波
        - VGA 图形界面
        - ADC 采样与 I2S 输出
      highlights:
        - 自制 PCB 扩展板提供音频采样适配电路
        - 通过 5 个 FIR 滤波器实现频谱分割和独立增益控制
        - 高通/低通 IIR 滤波器可动态切换截止频率
        - VGA 界面显示频谱、开关、增益和音量信息
      notes:
        - title: FPGA 音频链路
          content: 项目覆盖从模拟音频适配、ADC 采样、数字滤波、I2S 输出到 VGA 可视化的完整链路，重点是把数字逻辑、时序和外部硬件接口打通。
      links:
