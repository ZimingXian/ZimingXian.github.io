- id: power-modules
  title: 功率模块
  description: 面向整机能源链路中的功率变换、供电路径和异常保护，包含无线充电、DC-DC、预充电和缓启动等模块。
  cover: assets/projects/wireless-charging/c_wpt_7.jpg
  items:
    - id: wireless-charging
      title: RoboMaster 无线充电系统
      status: 已开源 / 实机运行
      summary: 基于 STM32G474 的数控无线充电发射端，可为机器人以 120W、86% 效率进行无线充电。
      images:
        - assets/projects/wireless-charging/c_wpt_7.jpg
        - assets/projects/wireless-charging/c_wpt_5.jpg
        - assets/projects/wireless-charging/c_wpt_6.jpg
        - assets/projects/wireless-charging/c_wpt_0.jpg
        - assets/projects/wireless-charging/c_wpt_1.png
        - assets/projects/wireless-charging/c_wpt_2.jpg
        - assets/projects/wireless-charging/c_wpt_3.jpg
        - assets/projects/wireless-charging/c_wpt_4.jpg
      metrics:
        - 最大功率 120W+
        - 整体充电效率约 86%
        - 80mm 线圈可承受约 15mm 偏移
        - ASK 反向通信实现功率闭环
      highlights:
        - 使用 LCC-S 拓扑，兼顾效率和抗偏移能力
        - 通过接收端反馈实现功率闭环和异常保护
        - 设计机械对位结构，提升机器人自动对位可靠性
      notes:
        - title: ASK 反向通信
          content: 接收端通过负载调制向发射端反馈状态，发射端根据反馈调节功率输出。关键点是让通信在功率传输噪声和线圈偏移下仍保持稳定。
        - title: 抗偏移设计
          content: 无线充电不是只看最佳对齐点效率，还要看机器人实际停靠误差下的功率和热稳定性。线圈尺寸、补偿网络和机械导向结构需要一起设计。
      links:
        - name: 开源文章：硬件/嵌入式
          url: "https://bbs.robomaster.com/article/761385"
        - name: 开源文章：机械结构/展示
          url: "https://bbs.robomaster.com/article/760961"
        - name: 工程文件
          url: "https://github.com/hkustenterprize/RM2025-PowerControlBoard-WirelessCharging"
        - name: PCB 预览：发射端
          url: "https://kicanvas.org/?github=https%3A%2F%2Fgithub.com%2Fhkustenterprize%2FRM2025-PowerControlBoard-WirelessCharging%2Ftree%2Fmain%2FWirelessCharger_V0.1"
        - name: PCB 预览：接收端
          url: "https://kicanvas.org/?github=https%3A%2F%2Fgithub.com%2Fhkustenterprize%2FRM2025-PowerControlBoard-WirelessCharging%2Ftree%2Fmain%2FPowerControlBoard_RXCoil_V0.1"

    - id: buck-48v-24v
      title: 大功率 48V 转 24V 降压模块
      status: 已开源
      summary: 小体积 48V 转 24V 降压模块，用于 RoboMaster 无人机云台系统供电。
      images:
        - assets/projects/buck-48v-24v/c_buck.jpg
        - assets/projects/buck-48v-24v/c_buck_1.png
      metrics:
        - 最大 20A 输出
        - 体积约 45x22x20mm
        - 7.5A 负载效率约 96.5%
        - FCCM 模式空载功耗约 2W
      highlights:
        - 使用独立辅助供电，降低高压输入下的空载功耗
        - FCCM 模式允许输出电流倒灌，适配特殊负载工况
      notes:
        - title: 辅助供电与空载功耗
          content: 高压输入下若直接由主功率芯片内部路径供电，轻载和空载损耗会比较明显。独立辅助供电可以降低控制部分损耗，并改善热设计余量。
      links:
        - name: 开源文章
          url: "https://bbs.robomaster.com/article/760956"
        - name: 工程文件
          url: "https://github.com/hkustenterprize/RM2025-LM5145-48to24"
        - name: PCB 预览
          url: "https://kicanvas.org/?github=https%3A%2F%2Fgithub.com%2Fhkustenterprize%2FRM2025-LM5145-48to24"

    - id: active-precharge
      title: 基于主动预充电的 48V 缓启动模块
      status: 待开源 / 待补充
      summary: 使用主动预充电解决负载存在电流时缓启动失败的问题，面向 48V 大电容和动力负载启动场景。
      images:
        - assets/projects/active-precharge/c_softstart_0.jpg
      metrics:
        - 预充电峰值电流可达 10A
        - 目标负载约 8mF 电容 + 4 个无人机动力电机
        - 启动冲击电流控制在约 15A 内
      highlights:
        - 使用 LM3409HV 恒流降压特性为负载预充电
        - 启动后由主功率开关旁路预充电路径
        - 主功率 MOS 使用 LM5069 驱动
      notes:
        - title: 主动预充电的动机
          content: 传统缓启动更适合近似纯电容负载。当负载在启动阶段已经消耗电流时，软启动路径可能无法按预期抬升母线电压。主动预充电通过受控电流先建立负载端电压，再切换主功率路径。

