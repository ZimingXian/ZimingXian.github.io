      images:
        - assets/projects/bldc-foc-board/foc_8115_1.jpg
        - assets/projects/bldc-foc-board/foc_8115_2.jpg
        - assets/projects/bldc-foc-board/foc_3510.jpg
        - assets/projects/bldc-foc-board/foc_6010.jpg
        - assets/projects/bldc-foc-board/6010_new_top.png
        - assets/projects/bldc-foc-board/6010_new_bottom.png
        - assets/projects/bldc-foc-board/8115_new_top.png
        - assets/projects/bldc-foc-board/8115_new_bottom.png
        - assets/projects/bldc-foc-board/3510_new_top.png
        - assets/projects/bldc-foc-board/3510_new_bottom.png
      metrics:
        - 低位电流采样
        - 隔离 FDCAN 通讯
        - 集成 eeprom 记录电机参数
