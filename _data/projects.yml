- id: supercap-system
  title: 数控电源
  description: 以<b>双向四开关 DCDC </b>为核心电路、利用超级电容高功率密度的特性为机器人底盘电机、关节电机提供缓冲，提高系统瞬时功率上限。采用峰值模拟电流内环 + 数字外环实现较快的响应速度；以可靠性作为核心设计指标，完善的保护机制经过长期使用验证；基于不同应用场景进行优化设计，以达到最大效能。
  cover: assets/projects/supercap-controller/cover.png
  items:
    - id: supercap-controller
      title: 底盘超级电容控制器（RM AWARD 2025 / 开源奖三等奖）
      status: 已开源
      summary: 基于 STM32G474 的双向四开关 BuckBoost 超级电容控制器，可为机器人底盘提供 400W+ 额外功率。<b>特化方向：低空载功耗、小体积</b>
      images:
        - assets/projects/supercap-controller/cover.png
        - assets/projects/supercap-controller/top.jpg
        - assets/projects/supercap-controller/bottom.jpg
        - assets/projects/supercap-controller/efficiency.png
        - assets/projects/supercap-controller/with_wptrx.jpg
        - assets/projects/supercap-controller/hardware_structure.png
        - assets/projects/supercap-controller/loop_structure.png
        - assets/projects/supercap-controller/system_structure.png
        - assets/projects/supercap-controller/buck_sequence.png
        - assets/projects/supercap-controller/buckboost_sequence.png
        - assets/projects/supercap-controller/boostbuck_sequence.png
        - assets/projects/supercap-controller/boost_sequence.png
      metrics:
        - title: 峰值 400W+ 额外输出功率
          content: 受限于比赛规则中的电容组电压 (30V)、电流 (15A) 限制
        - title: 峰值效率 97.5%+
          content: 详见左侧图 4 效率曲线
        - 空载功耗 <1.2W
        - 持续电流 15A
        - 电流环阶跃响应约 20us
        - 体积 60x44x30mm
        - 通过 CAN 总线与主控板通信，实时反馈运行状态与功率等参数
      highlights:
        - 充分利用 MCU 集成外设（DAC、比较器、运放、基准电压源、AWDG等）简化硬件设计
        - 高可靠性：在全阵容机器人上<b>稳定运行两赛季，未出现故障</b>
      notes:
        - title: 峰值电流控制模式
          content: 采用高位采样峰值电流模式控制 + 数字外环调节。峰值电流内环完全由硬件实现，使得内环响应极快（阶跃响应约 20us），同时降低了 MCU 的运算压力。
        - title: 无隔离电源上管常开
          content: 上管常开有助于提高转换效率。本模块利用 BuckBoost 拓扑本身的特性（一侧半桥需要常开时另一侧半桥一定在进行开关），使用了类似电荷泵的结构实现上管常开，同时无需增加额外的控制芯片。相比与隔离电源方案，此设计<b>有效减小了空载功耗</b>至 0.8-1.2W 左右。 
        - title: 完善的保护机制
          content: 拥有完善短路、过流、过压、电容组异常等保护功能，具有小故障自恢复逻辑与严重故障锁定功能，其中部分保护由硬件方式实现，提高了灵敏度并降低 MCU 负载。实际使用中，<b>保护系统曾多次有效识别并处理了电容组反接、电容组接线不稳</b>等情况，避免了危险事故的发生。
      links:
        - name: 开源文章
          url: "https://bbs.robomaster.com/article/761385"
        - name: 工程文件
          url: "https://github.com/hkustenterprize/RM2025-PowerControlBoard-WirelessCharging"
        - name: PCB 预览：控制板
          url: "https://kicanvas.org/?github=https%3A%2F%2Fgithub.com%2Fhkustenterprize%2FRM2025-PowerControlBoard-WirelessCharging%2Ftree%2Fmain%2FPowerControl_PCM_V0.1_Control"
        - name: PCB 预览：功率板
          url: "https://kicanvas.org/?github=https%3A%2F%2Fgithub.com%2Fhkustenterprize%2FRM2025-PowerControlBoard-WirelessCharging%2Ftree%2Fmain%2FPowerControl_PCM_V0.1_Power"
        - name: 项目简介
          url: "assets/projects/supercap-controller/RM2025_SuperCap_WPT_PPT.pdf"
        - name: 完整开源报告
          url: "assets/projects/supercap-controller/RM2025_SuperCap_WPT_Report.pdf"

    - id: supercap-array
      title: 高能量密度超级电容组
      status: 已开源
      summary: 适用于 RoboMaster 机器人的高能量密度超级电容组，通过尝试不同电容选型和结构排布实现高能量密度。
      images:
        - assets/projects/supercap-array/c_caparr_0.jpg
        - assets/projects/supercap-array/c_caparr_1.jpg
        - assets/projects/supercap-array/c_caparr_4.jpg
        - assets/projects/supercap-array/c_caparr_3.png
        - assets/projects/supercap-array/c_caparr_2.jpg
      metrics:
        - 理论储能约 1980J，实测大于 2150J
        - 峰值放电电流约 30A
        - 体积 78x44x66mm
        - 设计运行电压 29.0V (V1) / 29.5V (V2)
        - 使用柔性外壳提升恶劣工况下的防护能力
      highlights:
        - 超小体积（约为上一代的 50%），可将电容组压缩到机器人标准装甲板支架空间内
        - title: 高精度被动均衡
          content: V1：单体保护电压 2.95V，满电电压约 29.2V <br> V2：单体保护电压 2.98V，满电电压约 29.5V，通过 TL431 分立方案实现了泄放触发阈值偏差 < 5mV <br> 主动均衡： 通过 MCU 监测单体电压，使用电感式主动均衡方案实现了更小的电路体积与更高的安全性，后因会产生额外的功耗而放弃。
        - 已知超过 20 支队伍复刻
        - 高可靠性：在全阵容机器人上<b>稳定运行两赛季，未出现故障</b>
      links:
        - name: 开源文章
          url: "https://bbs.robomaster.com/article/760959?source=8"
        - name: 工程文件
          url: "https://github.com/hkustenterprize/RM2025-Super-Capacitor-Array"
        - name: PCB 预览
          url: "https://kicanvas.org/?github=https%3A%2F%2Fgithub.com%2Fhkustenterprize%2FRM2025-Super-Capacitor-Array"

    - id: buffer-capacitor-system-bypass
      title: 关节电机缓冲电容（旁路方案）
      status: 使用中
      summary: 将电容组通过双向四开关 BuckBoost 连接至供电母线，通过超级电容放电为关节电机提供额外爆发功率（~800W），提升整机稳定性与输出能力。<b>特化方向：高集成度、高功率</b>
      images:
        - assets/projects/buffer-capacitor-system-bypass/bottom.png
        - assets/projects/buffer-capacitor-system-bypass/top.jpg
        - assets/projects/buffer-capacitor-system-bypass/heat_sink.jpg
      metrics:
        - title: 最大输出功率约 800W
          content: 受限于超级电容放电能力（36A）、超级电容内阻、电感饱和电流
        - 电容端峰值放电电流 40A，峰值电感电流 50A
        - 体积 100x37x48mm
        - 通过 CAN 总线与主控板通信，实时反馈运行状态与功率等参数
      highlights:
        - 通过将电容单体、均衡电路、控制电路、功率电路集成在同一块 PCB 上以实现小体积、高功率密度与稳定性。
        - title: 峰值电流控制模式
          content: 采用<b>低位采样峰值电流模式控制</b> + 数字外环调节。峰值电流内环完全由硬件实现，响应极快（阶跃响应约 20us），降低了 MCU 的运算压力。低位采样构型使得电感电流采样带宽提高，更好还原电感电流波形，占空比抖动更小。通过优化 layout 与原件选型将消隐时间降低到 200ns。
        - title: 上管常开
          content: 上管常开有助于提高转换效率并允许低位采样设计下更高的占空比范围。利用 BuckBoost 拓扑本身的特性（一侧半桥需要常开时另一侧半桥一定在进行开关），使用了类似电荷泵的结构实现上管常开，同时无需增加额外的控制芯片。 
        - title: 完善的保护机制
          content: 拥有完善短路、过流、过压、电容组异常等保护功能，具有小故障自恢复逻辑与严重故障锁定功能。
      links:
    
