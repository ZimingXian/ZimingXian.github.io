          content: 通过 LMR51610 提供 10V 辅助供电，将空载功耗从 4W 左右降低至 2W，同时减小了 MOSFET 导通电阻，降低了大电流下的发热。
        - FCCM 模式允许输出电流倒灌，适配电机类负载
        - 40kHz 穿越频率下可保持约 60° 相位裕度，保证输出响应迅速
      links:
