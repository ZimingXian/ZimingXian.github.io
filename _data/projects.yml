    - id: laser-mirror-driver
      title: 高精度激光振镜驱动器
      summary: 基于 LDC (电感-数字传感器) 与 PCB 线圈的高精度激光振镜驱动器，可组成双轴激光振镜系统。
      images:
        - assets/projects/laser-mirror-driver/top.JPG
        - assets/projects/laser-mirror-driver/bottom.JPG
        - assets/projects/laser-mirror-driver/accuracy.png
        - assets/projects/laser-mirror-driver/two_axis_1.png
        - assets/projects/laser-mirror-driver/two_axis.JPG
        - assets/projects/laser-mirror-driver/single_axis.JPG
        - assets/projects/laser-mirror-driver/target_board.jpg
        - assets/projects/laser-mirror-driver/sensor_board.jpg
      metrics:
        - title: 角度分辨率 0.001°
          content: 详见图 3，阶跃响应测试
        - title: 重复定位精度约 0.006°
          content: 测试条件：在距离 20m 处观察激光落点，重新上电后闭环至相同位置，激光落点偏差小于 2mm
        - 双轴激光输出范围 ±40°
      highlights:
        - 使用 LDC (电感-数字传感器) 获取高精度位置反馈
        - 通过 DAC + 大功率运放驱动 PCB 线圈进行电流闭环，避免干扰 LDC
        - 单板集成 LDC、PCB 线圈、功率驱动和 MCU，保证了机械精度


